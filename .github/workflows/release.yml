# Publie une version : à chaque tag vX.Y.Z, construit le coffre prêt à l'emploi
# (trip-buddy-vX.Y.Z.zip, CHANGELOG inclus) et crée la release GitHub correspondante.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Construire le paquet
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sh .github/scripts/package.sh "$VERSION" dist

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/trip-buddy-v$VERSION.zip" \
            --title "Trip Buddy $VERSION" \
            --notes-file dist/release-notes.md \
            --verify-tag
